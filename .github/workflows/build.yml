name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Test
        run: |
          cd app && rm -rf modfiles && mkdir modfiles && cp -r ../mod/PsychoRando modfiles/
          GOFLAGS=-mod=mod GOSUMDB=off GOPROXY=off go test ./...
      - name: Build Windows exe
        run: sh build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PsychoRando
          path: dist/PsychoRando.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PsychoRando.exe
